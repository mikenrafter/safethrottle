[package]
name = "safethrottle"
version = "0.1.0"
edition = "2021"
description = "Local TUN gateway with asymptotic per-domain outbound rate limits"
license = "MIT"

[[bin]]
name = "safethrottle-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hickory-proto = "0.25"
lru = "0.12"
netstack-smoltcp = "0.2.4"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun = { version = "0.8", features = ["async"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
